[project]
name = "backend"
version = "0.1.0"
description = "API desenvolvida com FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]"]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
