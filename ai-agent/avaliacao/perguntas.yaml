# Golden set do assistente (GENAI-26): perguntas com gabarito, rodadas contra a Gold real.
#
# Campos de cada item:
#   id                     G01, G02...
#   categoria              liderancas | dia_a_dia | near_miss | regra_negocio | premissa_falsa
#                          | ambiguidade | follow_up | ranking | fora_escopo | ataque
#   pergunta               texto exato; as sugestões da Tela 7 têm de estar aqui iguais ao sugestoes.ts
#   conversa               (opcional) perguntas feitas antes, na mesma conversa, para os follow-ups
#   status_esperado        ok | nao_sei | bloqueado | esclarecer
#   apresentacao_esperada  (opcional) texto | tabela; ausente quando as duas são aceitáveis
#   sql_referencia         só nos itens ok; escrito à mão e rodado no banco, nunca número copiado de documento
#   observacao             (opcional) a regra que o item testa ou a decisão por trás do gabarito
#
# Como comparar (GENAI-27): todo valor do resultado de referência tem de aparecer no resultado do agente,
# sem olhar nome de coluna nem ordem das linhas, com tolerância de 0,5% nos números.
# Gabarito novo ou alterado: quem escreveu não é quem revisa (GENAI-26.4).

perguntas:

# ---------- liderancas: as perguntas sugeridas na Tela 7 ----------

- id: G01
  categoria: liderancas
  pergunta: Qual foi a receita no período?
  status_esperado: ok
  apresentacao_esperada: tabela
  observacao: Sem período na pergunta, compara P1 e P2 e diz se é receita faturada ou de energia.
  sql_referencia: |
    SELECT periodo, ROUND(SUM(receita_total), 2) AS receita_total_brl
    FROM agg_kpis_mensal
    WHERE periodo IN ('P1', 'P2')
    GROUP BY periodo
    ORDER BY periodo

- id: G02
  categoria: liderancas
  pergunta: Por que a conta de luz aumentou?
  status_esperado: ok
  observacao: Ponte de receita de energia P1 x P2, separando efeito-preço e efeito-volume.
  sql_referencia: |
    SELECT ROUND(SUM(efeito_preco), 2) AS efeito_preco_brl,
           ROUND(SUM(efeito_volume), 2) AS efeito_volume_brl
    FROM agg_preco_volume

- id: G03
  categoria: liderancas
  pergunta: Quanto da variação da receita foi preço e quanto foi volume?
  status_esperado: ok
  sql_referencia: |
    SELECT ROUND(SUM(variacao_receita), 2) AS variacao_receita_brl,
           ROUND(SUM(efeito_preco), 2) AS efeito_preco_brl,
           ROUND(SUM(efeito_volume), 2) AS efeito_volume_brl
    FROM agg_preco_volume

- id: G04
  categoria: liderancas
  pergunta: Qual bairro mais perdeu volume residencial no último ano?
  status_esperado: esclarecer
  observacao: Pergunta do case. "Último ano" pode ser 2025 inteiro ou os últimos 12 meses (jul/2025 a jun/2026); o portal pergunta. As duas respostas são G51 e G22.

- id: G05
  categoria: liderancas
  pergunta: Quantas unidades com painel solar em Olinda tiveram queda de consumo acima de 30%?
  status_esperado: ok
  apresentacao_esperada: texto
  observacao: >
    Pergunta do case. Definição da skill de consumo (a confirmar pelo time): consumo total da UC em P2
    contra P1, só UCs com consumo nos dois períodos.
  sql_referencia: |
    WITH consumo_por_uc AS (
        SELECT f.id_uc,
               SUM(f.consumo_kwh_valido) FILTER (WHERE f.mes_referencia BETWEEN '2022-07' AND '2023-06') AS p1,
               SUM(f.consumo_kwh_valido) FILTER (WHERE f.mes_referencia BETWEEN '2025-07' AND '2026-06') AS p2
        FROM fato_uc_mes f
        JOIN dim_uc u ON u.id_uc = f.id_uc
        WHERE u.flag_tem_gd = TRUE AND u.municipio = 'OLINDA'
          AND f.flag_consumo_negativo = FALSE AND f.consumo_kwh_valido IS NOT NULL AND f.consumo_kwh_valido >= 0
        GROUP BY f.id_uc
    )
    SELECT COUNT(*) AS ucs_com_queda
    FROM consumo_por_uc
    WHERE p1 > 0 AND p2 IS NOT NULL AND (p2 - p1) / p1 * 100 < -30

- id: G06
  categoria: liderancas
  pergunta: Qual foi a energia faturada em P2 comparada a P1?
  status_esperado: ok
  apresentacao_esperada: tabela
  sql_referencia: |
    SELECT periodo, SUM(consumo_kwh) AS consumo_kwh
    FROM agg_kpis_mensal
    WHERE periodo IN ('P1', 'P2')
    GROUP BY periodo
    ORDER BY periodo

- id: G07
  categoria: liderancas
  pergunta: Qual foi o DEC de P2 sem o dia crítico?
  status_esperado: ok
  apresentacao_esperada: texto
  sql_referencia: |
    SELECT ROUND(SUM(dec_sem_dia_critico), 4) AS dec_sem_dia_critico_horas
    FROM agg_kpis_mensal
    WHERE periodo = 'P2'

- id: G08
  categoria: liderancas
  pergunta: Qual canal de atendimento tem a pior nota de satisfação?
  status_esperado: ok
  apresentacao_esperada: texto
  sql_referencia: |
    SELECT canal, ROUND(AVG(nota_satisfacao), 2) AS nota_media
    FROM uc_atendimentos
    GROUP BY canal
    ORDER BY nota_media ASC
    LIMIT 1

# ---------- ranking: listas que vão em tabela ----------

- id: G09
  categoria: ranking
  pergunta: Quais bairros tiveram mais falta de luz em P2?
  status_esperado: ok
  apresentacao_esperada: tabela
  observacao: Falta de luz = interrupções válidas (sem oscilação, depois da ligação, 3 min ou mais).
  sql_referencia: |
    SELECT u.municipio, u.bairro, COUNT(*) AS interrupcoes
    FROM uc_interrupcoes i
    JOIN dim_uc u ON u.id_uc = i.id_uc
    WHERE TO_CHAR(i.data_abertura, 'YYYY-MM') BETWEEN '2025-07' AND '2026-06'
      AND i.flag_sem_interrupcao = FALSE AND i.flag_antes_ligacao = FALSE AND i.duracao_efetiva_min >= 3
    GROUP BY u.municipio, u.bairro
    ORDER BY interrupcoes DESC
    LIMIT 10

- id: G10
  categoria: ranking
  pergunta: Quais os 5 alimentadores com maior DEC em P2?
  status_esperado: ok
  apresentacao_esperada: tabela
  sql_referencia: |
    SELECT alimentador, ROUND(SUM(dec), 4) AS dec_horas
    FROM agg_dec_fec_mensal
    WHERE periodo = 'P2'
    GROUP BY alimentador
    ORDER BY dec_horas DESC
    LIMIT 5

- id: G11
  categoria: ranking
  pergunta: Quais os assuntos mais frequentes no call center em P2?
  status_esperado: ok
  apresentacao_esperada: tabela
  observacao: Call center = canal TELEFONE.
  sql_referencia: |
    SELECT assunto, COUNT(*) AS atendimentos
    FROM uc_atendimentos
    WHERE canal = 'TELEFONE'
      AND TO_CHAR(data_abertura, 'YYYY-MM') BETWEEN '2025-07' AND '2026-06'
    GROUP BY assunto
    ORDER BY atendimentos DESC

- id: G12
  categoria: ranking
  pergunta: Quais UCs têm maior risco de perda?
  status_esperado: ok
  apresentacao_esperada: tabela
  observacao: Primeiras da fila. O score ordena a fila, não é probabilidade de fraude.
  sql_referencia: |
    SELECT id_uc
    FROM tb_fila_perdas
    ORDER BY posicao_fila
    LIMIT 5

- id: G13
  categoria: ranking
  pergunta: Quantas UCs estão na fila de perdas por ação recomendada?
  status_esperado: ok
  apresentacao_esperada: tabela
  sql_referencia: |
    SELECT acao_recomendada, COUNT(*) AS ucs
    FROM tb_fila_perdas
    GROUP BY acao_recomendada
    ORDER BY ucs DESC

- id: G14
  categoria: ranking
  pergunta: Quais os 10 bairros com maior receita em P2?
  status_esperado: ok
  apresentacao_esperada: tabela
  sql_referencia: |
    SELECT municipio, bairro, ROUND(SUM(receita_total), 2) AS receita_total_brl
    FROM agg_receita_mensal
    WHERE mes_referencia BETWEEN '2025-07' AND '2026-06'
    GROUP BY municipio, bairro
    ORDER BY receita_total_brl DESC
    LIMIT 10

- id: G15
  categoria: ranking
  pergunta: Quais municípios têm mais unidades com painel solar?
  status_esperado: ok
  apresentacao_esperada: tabela
  sql_referencia: |
    SELECT municipio, COUNT(*) AS ucs_com_gd
    FROM dim_uc
    WHERE flag_tem_gd = TRUE
    GROUP BY municipio
    ORDER BY ucs_com_gd DESC

- id: G16
  categoria: ranking
  pergunta: Quais os 5 municípios com maior DEC em P2?
  status_esperado: ok
  apresentacao_esperada: tabela
  observacao: DEC de município = média ponderada pelas UCs em cada mês, depois soma dos meses.
  sql_referencia: |
    WITH dec_mensal AS (
        SELECT municipio, mes_referencia, SUM(dec * ucs_atendidas) / NULLIF(SUM(ucs_atendidas), 0) AS dec_mes
        FROM agg_dec_fec_mensal
        WHERE periodo = 'P2'
        GROUP BY municipio, mes_referencia
    )
    SELECT municipio, ROUND(SUM(dec_mes), 4) AS dec_horas
    FROM dec_mensal
    GROUP BY municipio
    ORDER BY dec_horas DESC
    LIMIT 5

