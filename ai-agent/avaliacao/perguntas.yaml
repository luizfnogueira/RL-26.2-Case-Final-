               SUM(f.consumo_kwh_valido) FILTER (WHERE f.mes_referencia BETWEEN '2025-07' AND '2026-06') AS p2
        FROM fato_uc_mes f
        JOIN dim_uc u ON u.id_uc = f.id_uc
