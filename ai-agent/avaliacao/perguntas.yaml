- id: G51
  categoria: liderancas
  pergunta: Qual bairro mais perdeu volume residencial em 2025?
  status_esperado: ok
  observacao: Opção "2025 (jan a dez)" da pergunta do case (G04). Ano civil compara com o ano anterior inteiro.
  sql_referencia: |
    SELECT municipio, bairro,
           COALESCE(SUM(consumo_kwh) FILTER (WHERE mes_referencia BETWEEN '2025-01' AND '2025-12'), 0)
         - COALESCE(SUM(consumo_kwh) FILTER (WHERE mes_referencia BETWEEN '2024-01' AND '2024-12'), 0) AS variacao_volume_kwh
    FROM agg_receita_mensal
    WHERE classe = 'RESIDENCIAL' AND mes_referencia BETWEEN '2024-01' AND '2025-12'
    GROUP BY municipio, bairro
    ORDER BY variacao_volume_kwh ASC
    LIMIT 1

