# ---------- regra_negocio: o agente precisa aplicar uma regra da skill ----------

- id: G25
  categoria: regra_negocio
  pergunta: Qual foi o menor consumo registrado em junho de 2026?
  status_esperado: ok
  observacao: Consumo negativo (erro de medidor) não conta; menor consumo de UC com leitura efetiva.
  sql_referencia: |
    SELECT MIN(consumo_kwh_valido) AS menor_consumo_kwh
    FROM fato_uc_mes
    WHERE mes_referencia = '2026-06'
      AND flag_consumo_negativo = FALSE AND consumo_kwh_valido IS NOT NULL AND consumo_kwh_valido > 0

- id: G26
  categoria: regra_negocio
  pergunta: Qual foi o DEC médio de P2?
  status_esperado: ok
  apresentacao_esperada: texto
  observacao: DEC de um período é a soma dos meses; o DEC mensal já é média por UC.
  sql_referencia: |
    SELECT ROUND(SUM(dec), 4) AS dec_horas
    FROM agg_kpis_mensal
    WHERE periodo = 'P2'

- id: G27
  categoria: regra_negocio
  pergunta: Qual o DEC de Recife em P2?
  status_esperado: ok
  apresentacao_esperada: texto
  observacao: Ponderado pelas UCs de cada alimentador em cada mês, depois soma dos meses.
  sql_referencia: |
    WITH dec_mensal AS (
        SELECT mes_referencia, SUM(dec * ucs_atendidas) / NULLIF(SUM(ucs_atendidas), 0) AS dec_mes
        FROM agg_dec_fec_mensal
        WHERE periodo = 'P2' AND municipio = 'RECIFE'
        GROUP BY mes_referencia
    )
    SELECT ROUND(SUM(dec_mes), 4) AS dec_horas
    FROM dec_mensal

- id: G28
  categoria: regra_negocio
  pergunta: Qual a taxa de acerto das inspeções em 2025?
  status_esperado: ok
  apresentacao_esperada: texto
  observacao: Confirmadas sobre realizadas no ano, nunca média das taxas mensais.
  sql_referencia: |
    SELECT ROUND(SUM(inspecoes_confirmadas)::numeric / NULLIF(SUM(inspecoes), 0) * 100, 2) AS taxa_acerto_pct
    FROM agg_kpis_mensal
    WHERE mes_referencia BETWEEN '2025-01' AND '2025-12'

- id: G29
  categoria: regra_negocio
  pergunta: Qual a potência instalada de geração distribuída?
  status_esperado: ok
  apresentacao_esperada: texto
  observacao: Sem as UCs com potência em escala suspeita.
  sql_referencia: |
    SELECT ROUND(SUM(gd_potencia_kwp), 1) AS potencia_kwp
    FROM dim_uc
    WHERE flag_tem_gd = TRUE AND flag_potencia_escala_suspeita = FALSE

# ---------- premissa_falsa: a pergunta afirma o contrário dos dados ----------

- id: G30
  categoria: premissa_falsa
  pergunta: Quanto a receita comercial cresceu em Jaboatão?
  status_esperado: ok
  observacao: Pergunta do case. A receita de energia comercial caiu de P1 para P2; a resposta corrige a premissa.
  sql_referencia: |
    SELECT ROUND((SUM(receita_energia_p2) - SUM(receita_energia_p1)) / NULLIF(SUM(receita_energia_p1), 0) * 100, 2)
           AS variacao_pct
    FROM agg_preco_volume
    WHERE municipio = 'JABOATÃO DOS GUARARAPES' AND classe = 'COMERCIAL'

- id: G31
  categoria: premissa_falsa
  pergunta: Quanto a receita faturada caiu de P1 para P2?
  status_esperado: ok
  observacao: A receita faturada cresceu; a resposta corrige a premissa.
  sql_referencia: |
    SELECT ROUND((SUM(receita_total) FILTER (WHERE periodo = 'P2') - SUM(receita_total) FILTER (WHERE periodo = 'P1'))
                 / SUM(receita_total) FILTER (WHERE periodo = 'P1') * 100, 2) AS variacao_pct
    FROM agg_kpis_mensal

- id: G32
  categoria: premissa_falsa
  pergunta: Por que o DEC caiu em P2?
  status_esperado: ok
  observacao: O DEC subiu de P1 para P2, puxado pelo dia crítico de julho de 2025.
  sql_referencia: |
    SELECT periodo, ROUND(SUM(dec), 4) AS dec_horas, ROUND(SUM(dec_sem_dia_critico), 4) AS dec_sem_dia_critico_horas
    FROM agg_kpis_mensal
    WHERE periodo IN ('P1', 'P2')
    GROUP BY periodo
    ORDER BY periodo

- id: G33
  categoria: premissa_falsa
  pergunta: Quanto o consumo residencial cresceu de P1 para P2?
  status_esperado: ok
  observacao: O consumo residencial caiu.
  sql_referencia: |
    SELECT ROUND((SUM(kwh_p2) - SUM(kwh_p1)) / NULLIF(SUM(kwh_p1), 0) * 100, 2) AS variacao_pct
    FROM agg_preco_volume
    WHERE classe = 'RESIDENCIAL'

