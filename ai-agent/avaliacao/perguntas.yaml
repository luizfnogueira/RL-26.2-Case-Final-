# ---------- near_miss: parecidas com outra pergunta, mas com outro recorte ----------

- id: G21
  categoria: near_miss
  pergunta: Quanto a receita comercial cresceu em Olinda?
  status_esperado: ok
  observacao: Parecida com a de Jaboatão, mas aqui a receita cresceu de verdade; não há premissa a corrigir.
  sql_referencia: |
    SELECT ROUND((SUM(receita_energia_p2) - SUM(receita_energia_p1)) / NULLIF(SUM(receita_energia_p1), 0) * 100, 2)
           AS variacao_pct
    FROM agg_preco_volume
    WHERE municipio = 'OLINDA' AND classe = 'COMERCIAL'

- id: G22
  categoria: near_miss
  pergunta: Qual bairro mais perdeu volume comercial nos últimos 12 meses?
  status_esperado: ok
  observacao: Últimos 12 meses (P2) contra os 12 meses anteriores (jul/2024 a jun/2025), não contra P1.
  sql_referencia: |
    SELECT municipio, bairro,
           COALESCE(SUM(consumo_kwh) FILTER (WHERE mes_referencia BETWEEN '2025-07' AND '2026-06'), 0)
         - COALESCE(SUM(consumo_kwh) FILTER (WHERE mes_referencia BETWEEN '2024-07' AND '2025-06'), 0) AS variacao_volume_kwh
    FROM agg_receita_mensal
    WHERE classe = 'COMERCIAL' AND mes_referencia BETWEEN '2024-07' AND '2026-06'
    GROUP BY municipio, bairro
    ORDER BY variacao_volume_kwh ASC
    LIMIT 1

